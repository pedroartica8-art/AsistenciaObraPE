name: Build AsistenciaObraPE APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - ".source/**"
      - ".github/workflows/build-from-source.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct Android project
        shell: bash
        run: |
          cat .source/chunk_* | base64 --decode > AsistenciaObraPE.zip
          unzip -q AsistenciaObraPE.zip
          test -f AsistenciaObraPE/app/src/main/AndroidManifest.xml
          test -f AsistenciaObraPE/app/src/main/java/pe/asistencia/obra/MainActivity.java

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate seed data
        shell: bash
        working-directory: AsistenciaObraPE
        run: |
          mkdir -p build/smoke
          javac -d build/smoke             app/src/main/java/pe/asistencia/obra/CoreUtils.java             app/src/main/java/pe/asistencia/obra/SeedData.java             tools/CoreSmokeTest.java
          java -cp build/smoke CoreSmokeTest

      - name: Build debug APK
        shell: bash
        working-directory: AsistenciaObraPE
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          APK="AsistenciaObraPE/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -l "$APK" | grep -q "AndroidManifest.xml"
          unzip -l "$APK" | grep -q "classes.dex"
          cp "$APK" AsistenciaObraPE-debug.apk
          sha256sum AsistenciaObraPE-debug.apk
          ls -lh AsistenciaObraPE-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AsistenciaObraPE-APK
          path: AsistenciaObraPE-debug.apk
          if-no-files-found: error
          retention-days: 30
